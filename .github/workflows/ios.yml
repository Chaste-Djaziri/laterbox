name: Native iOS Build & TestFlight
on:
  push:
    branches: [main]
    paths: ['laterbox-ios/**', '.github/workflows/ios.yml']
  pull_request:
    branches: [main]
    paths: ['laterbox-ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Xcode 27
        run: |
          xcodebuild -version
          xcodebuild -version | grep -q 'Xcode 27\.'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r laterbox-ios/ci/requirements.txt
      - name: Test release preflight
        run: python -m unittest discover -s laterbox-ios/ci -p 'test_*.py'
      - name: Run native Swift and UI tests
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS-27" in runtime for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild -project laterbox-ios/laterbox-ios.xcodeproj -scheme laterbox-ios \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/NativeTests.xcresult" -parallel-testing-enabled NO \
            -collect-test-diagnostics never -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/NativeTests.xcresult
  upload:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r laterbox-ios/ci/requirements.txt
      - name: Install and validate signing credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for name in APPLE_CERTIFICATE_BASE64 APPLE_PROVISIONING_PROFILE_BASE64 APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            test -n "${!name}" || { echo "::error::Missing secret $name"; exit 1; }
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/laterbox-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution'
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/main.mobileprovision"
          printf '%s' "$APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/share.mobileprovision"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          python laterbox-ios/ci/signing.py
      - name: Determine newer version and build
        run: python laterbox-ios/ci/app_store.py prepare
      - name: Archive native app and embedded share extension
        run: |
          xcodebuild -project laterbox-ios/laterbox-ios.xcodeproj -scheme laterbox-ios \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LaterBox.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' DEVELOPMENT_TEAM=LS42X27YFY \
            MARKETING_VERSION="$IOS_VERSION" CURRENT_PROJECT_VERSION="$IOS_BUILD" archive
          python laterbox-ios/ci/verify_archive.py "$RUNNER_TEMP/LaterBox.xcarchive"
      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LaterBox.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/IPA"
      - uses: actions/upload-artifact@v4
        with:
          name: laterbox-ios-${{ env.IOS_VERSION }}-${{ env.IOS_BUILD }}
          path: |
            ${{ runner.temp }}/IPA/*.ipa
            ${{ runner.temp }}/LaterBox.xcarchive/dSYMs/
          if-no-files-found: error
      - name: Upload to existing TestFlight app
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/IPA" -name '*.ipa' -type f -print -quit)
          test -n "$IPA_PATH"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Verify Apple processing
        run: python laterbox-ios/ci/app_store.py verify
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/laterbox-signing.keychain-db" || true
          if [ -f "$RUNNER_TEMP/installed-profiles.txt" ]; then
            while IFS= read -r profile; do rm -f "$profile"; done < "$RUNNER_TEMP/installed-profiles.txt"
            rm -f "$RUNNER_TEMP/installed-profiles.txt"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/main.mobileprovision" "$RUNNER_TEMP/share.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
