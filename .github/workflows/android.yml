name: Native Android Build & Release
on:
  push:
    branches: [main]
    paths: ['laterbox-android/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
    paths: ['laterbox-android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test Native Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: laterbox-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android Keystore (if secret present)
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Configuring release keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/laterbox-android/app/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found, skipping signing configuration."
          fi

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build Android App Bundle and APK
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-android-aab-${{ github.run_id }}
          path: laterbox-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-android-apk-${{ github.run_id }}
          path: laterbox-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish to Google Play (Internal track)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_PLAY_SECRET == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pro.micorp.laterbox
          releaseFiles: laterbox-android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
        env:
          HAS_PLAY_SECRET: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
