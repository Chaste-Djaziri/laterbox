name: Release & Build Laterbox

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  check-version:
    name: Detect Version Bump
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      release_scope: ${{ steps.check.outputs.release_scope }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check If Version Was Bumped
        id: check
        shell: bash
        run: |
          VERSION=$(node -p "require('./version.json').version")
          RELEASE_SCOPE="all"
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.event.head_commit.message }}" == *"[macos-only]"* ]]; then
            RELEASE_SCOPE="macos"
          fi
          echo "release_scope=$RELEASE_SCOPE" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Manual dispatch or tag trigger for v$VERSION. Proceeding with release build."
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          # If before commit is a valid commit hash on this repo, check diff across the entire push range
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify "$BEFORE" >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null || echo "")
          else
            # Check against latest tag if available, or last commit
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              CHANGED_FILES=$(git diff --name-only "$LAST_TAG" HEAD 2>/dev/null || echo "")
            else
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            fi
          fi

          echo "Pushed range: $BEFORE .. $AFTER"
          echo "Changed files in pushed range:"
          echo "$CHANGED_FILES"

          # 1. Did any version file change in the pushed commits?
          VERSION_CHANGED="false"
          if echo "$CHANGED_FILES" | grep -qE 'version\.json|pubspec\.yaml'; then
            VERSION_CHANGED="true"
          fi

          # 2. Does the git tag for this current version (v$VERSION) already exist?
          TAG_EXISTS="false"
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1 || git rev-parse "v$VERSION" >/dev/null 2>&1; then
            TAG_EXISTS="true"
          fi

          # If version files were touched in the push OR the tag for this version doesn't exist yet, proceed with release
          if [ "$VERSION_CHANGED" = "true" ] || [ "$TAG_EXISTS" = "false" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Release build triggered for v$VERSION (version changed: $VERSION_CHANGED, tag exists: $TAG_EXISTS)."
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "No version bump in pushed range and release tag v$VERSION already exists. Skipping release builds."
          fi

  build-macos:
    name: Build macOS Release & App Store Connect / TestFlight
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_MAC_PROVISIONING_PROFILE_BASE64 }}
      APPLE_MAC_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_MAC_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
      APPLE_MAC_SAFARI_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_MAC_SAFARI_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SKIP_MACOS_NOTARIZATION: 'true'
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Safari extension assets
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Package Safari extension resources
        run: |
          cd extension
          npm ci
          npm run build:safari

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Apple Certificates & Provisioning Profiles
        if: env.APPLE_CERTIFICATE_BASE64 != '' || env.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 != '' || env.APPLE_INSTALLER_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          # 1. Decode and import main Application/Distribution Certificate
          if [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
            security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          fi

          # 2. Import the Developer ID Application certificate used only for
          # direct downloads. Mac App Store certificates cannot sign a DMG
          # that users launch outside the App Store.
          if [ -n "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" ]; then
            DEVELOPER_ID_PWD="${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:-$APPLE_CERTIFICATE_PASSWORD}"
            echo "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/developer_id_cert.p12
            security import $RUNNER_TEMP/developer_id_cert.p12 -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_PWD" -T /usr/bin/codesign -T /usr/bin/security
          fi

          # 3. Decode and import Mac Installer Certificate if provided separately
          if [ -n "$APPLE_INSTALLER_CERTIFICATE_BASE64" ]; then
            INSTALLER_PWD="${APPLE_INSTALLER_CERTIFICATE_PASSWORD:-$APPLE_CERTIFICATE_PASSWORD}"
            echo "$APPLE_INSTALLER_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/installer_cert.p12
            security import $RUNNER_TEMP/installer_cert.p12 -k "$KEYCHAIN_PATH" -P "$INSTALLER_PWD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 3. Decode and install macOS Main Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          MAIN_PROFILE_B64="$APPLE_MAC_PROVISIONING_PROFILE_BASE64"
          if [ -n "$MAIN_PROFILE_B64" ]; then
            echo "$MAIN_PROFILE_B64" | base64 --decode > /tmp/mac_main.provisionprofile
            UUID=$(security cms -D -i /tmp/mac_main.provisionprofile 2>/dev/null | grep -A1 '<key>UUID</key>' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | xargs || true)
            if [ -n "$UUID" ]; then
              cp /tmp/mac_main.provisionprofile ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.provisionprofile
              echo "Installed macOS provisioning profile (UUID: $UUID)"
            fi
          fi

          # 4. Decode and install macOS Share Extension Provisioning Profile
          SHARE_PROFILE_B64="$APPLE_MAC_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64"
          if [ -n "$SHARE_PROFILE_B64" ]; then
            echo "$SHARE_PROFILE_B64" | base64 --decode > /tmp/mac_share.provisionprofile
            SHARE_UUID=$(security cms -D -i /tmp/mac_share.provisionprofile 2>/dev/null | grep -A1 '<key>UUID</key>' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | xargs || true)
            if [ -n "$SHARE_UUID" ]; then
              cp /tmp/mac_share.provisionprofile ~/Library/MobileDevice/Provisioning\ Profiles/${SHARE_UUID}.provisionprofile
              echo "Installed macOS ShareExtension provisioning profile (UUID: $SHARE_UUID)"
            fi
          fi

          # 5. Decode and install the embedded Safari Web Extension profile.
          if [ -n "$APPLE_MAC_SAFARI_EXTENSION_PROVISIONING_PROFILE_BASE64" ]; then
            echo "$APPLE_MAC_SAFARI_EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/mac_safari.provisionprofile
            SAFARI_UUID=$(security cms -D -i /tmp/mac_safari.provisionprofile 2>/dev/null | grep -A1 '<key>UUID</key>' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | xargs)
            test -n "$SAFARI_UUID"
            cp /tmp/mac_safari.provisionprofile ~/Library/MobileDevice/Provisioning\ Profiles/${SAFARI_UUID}.provisionprofile
            echo "Installed macOS SafariExtension provisioning profile (UUID: $SAFARI_UUID)"
          fi
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_MAC_PROVISIONING_PROFILE_BASE64 }}
          APPLE_MAC_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_MAC_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          APPLE_MAC_SAFARI_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_MAC_SAFARI_EXTENSION_PROVISIONING_PROFILE_BASE64 }}

      - name: Configure macOS Project
        run: flutter build macos --release --config-only

      - name: Build macOS Application
        run: |
          # Build macOS release bundle without code signing at compile time.
          # Full inside-out codesigning with entitlements and hardened runtime
          # is performed in the packaging step below to prevent SPM resource targets
          # failing on missing provisioning profiles during compilation.
          xcodebuild -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/macos \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -destination 'generic/platform=macOS' \
            build

      - name: Notarize DMG (when Developer ID available)
        if: env.SKIP_MACOS_NOTARIZATION != 'true' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        shell: bash
        run: |
          echo "Notarization will run after DMG creation via notarytool"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package macOS DMG, PKG & Universal Zip
        shell: bash
        run: |
          mkdir -p dist
          APP_PATH=$(find build/macos -name "laterbox.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/macos -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "laterbox.app" -type d | head -n 1)
          fi
          
          echo "Packaging application from: $APP_PATH"
          
          # Inspect keychain identities
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          if [ -f "$KEYCHAIN_PATH" ]; then
            echo "--- Available identities in keychain ---"
            security find-identity -v "$KEYCHAIN_PATH" || true
            echo "----------------------------------------"
          fi
          
          MAC_APP_STORE_APP_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" 2>/dev/null | grep -E "3rd Party Mac Developer Application|Apple Distribution" | head -n 1 | sed 's/.*"\(.*\)".*/\1/' || true)
          DEV_ID_APP_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" 2>/dev/null | grep -E "Developer ID Application" | head -n 1 | sed 's/.*"\(.*\)".*/\1/' || true)
          ANY_APP_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" 2>/dev/null | grep -E "3rd Party Mac Developer Application|Apple Distribution|Developer ID Application|Apple Development|Mac Developer" | head -n 1 | sed 's/.*"\(.*\)".*/\1/' || true)
          
          MAC_INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" 2>/dev/null | grep -E "3rd Party Mac Developer Installer" | head -n 1 | sed 's/.*"\(.*\)".*/\1/' || true)
          DEV_ID_INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" 2>/dev/null | grep -E "Developer ID Installer" | head -n 1 | sed 's/.*"\(.*\)".*/\1/' || true)
          
          # Inside-out signing helper:
          # Apple Technical Note TN3127: Never use --deep for production code signing
          # as it strips/overrides nested component entitlements.
          sign_bundle() {
            local TARGET_APP="$1"
            local SIGN_IDENTITY="$2"
            local SIGN_OPTS="--force --timestamp --options runtime"
            
            if [ -z "$SIGN_IDENTITY" ] || [ "$SIGN_IDENTITY" = "-" ]; then
              SIGN_IDENTITY="-"
              SIGN_OPTS="--force"
            fi
            
            echo "Signing $TARGET_APP with identity: '$SIGN_IDENTITY'"
            
            # 1. Sign all embedded frameworks and dylibs
            if [ -d "$TARGET_APP/Contents/Frameworks" ]; then
              find "$TARGET_APP/Contents/Frameworks" -depth -type d -name "*.framework" 2>/dev/null | while read -r fw; do
                codesign $SIGN_OPTS --sign "$SIGN_IDENTITY" "$fw"
              done
              find "$TARGET_APP/Contents/Frameworks" -type f \( -name "*.dylib" -o -name "*.so" \) 2>/dev/null | while read -r dylib; do
                codesign $SIGN_OPTS --sign "$SIGN_IDENTITY" "$dylib"
              done
            fi
            
            # 2. Sign ShareExtension executable and bundle with its own App Sandbox entitlements
            local EXT_DIR="$TARGET_APP/Contents/PlugIns/ShareExtension.appex"
            if [ -d "$EXT_DIR" ]; then
              if [ -f "$EXT_DIR/Contents/MacOS/ShareExtension" ]; then
                codesign $SIGN_OPTS \
                  --entitlements macos/ShareExtension/ShareExtension.entitlements \
                  --sign "$SIGN_IDENTITY" \
                  "$EXT_DIR/Contents/MacOS/ShareExtension"
              fi
              codesign $SIGN_OPTS \
                --entitlements macos/ShareExtension/ShareExtension.entitlements \
                --sign "$SIGN_IDENTITY" \
                "$EXT_DIR"
            fi

            # 3. Sign the embedded Safari Web Extension with its own entitlement set.
            local SAFARI_DIR="$TARGET_APP/Contents/PlugIns/SafariExtension.appex"
            test -d "$SAFARI_DIR"
            codesign $SIGN_OPTS \
              --entitlements macos/SafariExtension/SafariExtension.entitlements \
              --sign "$SIGN_IDENTITY" \
              "$SAFARI_DIR/Contents/MacOS/SafariExtension"
            codesign $SIGN_OPTS \
              --entitlements macos/SafariExtension/SafariExtension.entitlements \
              --sign "$SIGN_IDENTITY" \
              "$SAFARI_DIR"
            
            # 4. Sign main executable with Runner Release App Sandbox entitlements
            if [ -f "$TARGET_APP/Contents/MacOS/laterbox" ]; then
              codesign $SIGN_OPTS \
                --entitlements macos/Runner/Release.entitlements \
                --sign "$SIGN_IDENTITY" \
                "$TARGET_APP/Contents/MacOS/laterbox"
            fi
            
            # 5. Sign root app bundle WITHOUT --deep to preserve nested entitlements
            codesign $SIGN_OPTS \
              --entitlements macos/Runner/Release.entitlements \
              --sign "$SIGN_IDENTITY" \
              "$TARGET_APP"
              
            echo "Verifying code signature & App Sandbox entitlements for $TARGET_APP:"
            codesign --verify --deep --strict --verbose=2 "$TARGET_APP"
            echo "Main executable entitlements:"
            codesign -d --entitlements :- "$TARGET_APP/Contents/MacOS/laterbox" 2>/dev/null | grep -q "com.apple.security.app-sandbox"
            if [ -d "$EXT_DIR" ]; then
              echo "ShareExtension entitlements:"
              codesign -d --entitlements :- "$EXT_DIR/Contents/MacOS/ShareExtension" 2>/dev/null | grep -q "com.apple.security.app-sandbox"
            fi
            codesign -d --entitlements :- "$SAFARI_DIR/Contents/MacOS/SafariExtension" 2>/dev/null | grep -q "com.apple.security.app-sandbox"
          }

          # --- 1. Sign & Package Direct Distribution (DMG & Universal Zip for Sparkle / GitHub) ---
          if [ -z "$DEV_ID_APP_IDENTITY" ]; then
            echo "::error::A Developer ID Application certificate is required for downloadable macOS builds. Add APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 (and its password) before releasing."
            exit 1
          fi
          DMG_APP_IDENTITY="$DEV_ID_APP_IDENTITY"
          sign_bundle "$APP_PATH" "$DMG_APP_IDENTITY"

          # 1a. Create Universal DMG
          hdiutil create -volname "LaterBox" -srcfolder "$APP_PATH" -ov -format UDZO dist/laterbox-macos-universal.dmg
          cp dist/laterbox-macos-universal.dmg dist/laterbox-macos.dmg
          cp dist/laterbox-macos-universal.dmg dist/laterbox-macos-apple-silicon.dmg
          cp dist/laterbox-macos-universal.dmg dist/laterbox-macos-intel.dmg
          
          # 1b. Notarization is temporarily disabled because Apple reports
          # that this team is not configured for it (status 7000). Set this
          # value to false once Apple enables notarization for the team.
          if [ "$SKIP_MACOS_NOTARIZATION" = "true" ]; then
            echo "::warning::Skipping macOS notarization. Direct-download DMGs may be blocked by Gatekeeper."
          else
            if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              echo "::error::APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID are required to notarize downloadable macOS builds."
              exit 1
            fi
            echo "Submitting DMG for notarization…"
            xcrun notarytool submit dist/laterbox-macos-universal.dmg \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple dist/laterbox-macos-universal.dmg
            spctl -a -vvv -t open dist/laterbox-macos-universal.dmg
            cp dist/laterbox-macos-universal.dmg dist/laterbox-macos.dmg
            cp dist/laterbox-macos-universal.dmg dist/laterbox-macos-apple-silicon.dmg
            cp dist/laterbox-macos-universal.dmg dist/laterbox-macos-intel.dmg
          fi

          # 1c. Create Universal Zip (Sparkle delta-friendly)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/laterbox-macos-universal.zip
          cp dist/laterbox-macos-universal.zip dist/laterbox-macos.zip

          # --- 2. Prepare & Sign Dedicated Mac App Store Package ---
          APPSTORE_APP="/tmp/appstore/laterbox.app"
          mkdir -p /tmp/appstore
          rm -rf "$APPSTORE_APP"
          cp -R "$APP_PATH" "$APPSTORE_APP"

          # Embed provisioning profiles if available
          if [ -f /tmp/mac_main.provisionprofile ]; then
            echo "Embedding provisioning profile into App Store bundle..."
            cp /tmp/mac_main.provisionprofile "$APPSTORE_APP/Contents/embedded.provisionprofile"
          fi
          if [ -f /tmp/mac_share.provisionprofile ] && [ -d "$APPSTORE_APP/Contents/PlugIns/ShareExtension.appex/Contents" ]; then
            echo "Embedding share extension provisioning profile..."
            cp /tmp/mac_share.provisionprofile "$APPSTORE_APP/Contents/PlugIns/ShareExtension.appex/Contents/embedded.provisionprofile"
          fi
          if [ -f /tmp/mac_safari.provisionprofile ] && [ -d "$APPSTORE_APP/Contents/PlugIns/SafariExtension.appex/Contents" ]; then
            echo "Embedding Safari extension provisioning profile..."
            cp /tmp/mac_safari.provisionprofile "$APPSTORE_APP/Contents/PlugIns/SafariExtension.appex/Contents/embedded.provisionprofile"
          fi

          profile_bundle_id() {
            local profile_plist
            profile_plist=$(mktemp)
            security cms -D -i "$1" > "$profile_plist"
            /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$profile_plist" | sed 's/^[^.]*\.//'
            rm -f "$profile_plist"
          }

          require_profile_bundle_id() {
            local profile_path="$1"
            local expected_bundle_id="$2"
            local actual_bundle_id
            actual_bundle_id=$(profile_bundle_id "$profile_path")
            if [ "$actual_bundle_id" != "$expected_bundle_id" ]; then
              echo "::error::Provisioning profile bundle ID mismatch. Expected $expected_bundle_id, received $actual_bundle_id."
              exit 1
            fi
          }

          require_profile_bundle_id "$APPSTORE_APP/Contents/embedded.provisionprofile" "pro.micorp.laterbox"
          require_profile_bundle_id "$APPSTORE_APP/Contents/PlugIns/ShareExtension.appex/Contents/embedded.provisionprofile" "pro.micorp.laterbox.ShareExtension"
          require_profile_bundle_id "$APPSTORE_APP/Contents/PlugIns/SafariExtension.appex/Contents/embedded.provisionprofile" "pro.micorp.laterbox.SafariExtension"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPSTORE_APP/Contents/Info.plist" | grep -qx 'pro.micorp.laterbox'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPSTORE_APP/Contents/PlugIns/ShareExtension.appex/Contents/Info.plist" | grep -qx 'pro.micorp.laterbox.ShareExtension'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPSTORE_APP/Contents/PlugIns/SafariExtension.appex/Contents/Info.plist" | grep -qx 'pro.micorp.laterbox.SafariExtension'

          # Sign App Store bundle with Apple Distribution / 3rd Party Mac Developer Application
          APPSTORE_APP_IDENTITY="${MAC_APP_STORE_APP_IDENTITY:-${ANY_APP_IDENTITY:--}}"
          sign_bundle "$APPSTORE_APP" "$APPSTORE_APP_IDENTITY"

          # Create PKG archive with productbuild
          if [ -n "$MAC_INSTALLER_IDENTITY" ]; then
            echo "Building signed Mac App Store package with: $MAC_INSTALLER_IDENTITY"
            if ! perl -e '
              $timeout = shift @ARGV;
              alarm $timeout;
              exec @ARGV or die "Unable to start productbuild: $!\\n";
            ' 600 productbuild --timestamp=none --sign "$MAC_INSTALLER_IDENTITY" --component "$APPSTORE_APP" /Applications dist/laterbox-macos.pkg; then
              echo "::error::Mac App Store package build failed or timed out after 10 minutes."
              exit 1
            fi
            cp dist/laterbox-macos.pkg dist/laterbox-macos-installer.pkg
          elif [ -n "$DEV_ID_INSTALLER_IDENTITY" ]; then
            echo "Building signed installer package with Developer ID Installer: $DEV_ID_INSTALLER_IDENTITY"
            productbuild --sign "$DEV_ID_INSTALLER_IDENTITY" --component "$APP_PATH" /Applications dist/laterbox-macos-installer.pkg
            cp dist/laterbox-macos-installer.pkg dist/laterbox-macos.pkg
          else
            echo "Building unsigned installer package"
            productbuild --component "$APP_PATH" /Applications dist/laterbox-macos-installer.pkg || true
            cp dist/laterbox-macos-installer.pkg dist/laterbox-macos.pkg 2>/dev/null || true
          fi

          # --- 3. Generate Sparkle appcast when Sparkle private key is present ---
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_key.pem
            if command -v generate_appcast >/dev/null 2>&1; then
              mkdir -p dist/appcast
              cp dist/laterbox-macos-universal.zip dist/appcast/ 2>/dev/null || true
              generate_appcast --ed-key-file /tmp/sparkle_key.pem dist/appcast || true
              cp dist/appcast/appcast.xml dist/ 2>/dev/null || true
            else
              echo "generate_appcast not found — skipping appcast generation"
            fi
          fi
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - name: Upload macOS Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-macos-dist
          path: |
            dist/laterbox-macos.dmg
            dist/laterbox-macos-universal.dmg
            dist/laterbox-macos-apple-silicon.dmg
            dist/laterbox-macos-intel.dmg
            dist/laterbox-macos-installer.pkg
            dist/laterbox-macos.pkg
            dist/laterbox-macos-universal.zip
            dist/laterbox-macos.zip
            dist/appcast.xml
          if-no-files-found: error

      - name: Upload to Mac App Store Connect / TestFlight
        if: env.APP_STORE_CONNECT_API_KEY_BASE64 != '' && env.APP_STORE_CONNECT_KEY_ID != ''
        shell: bash
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          MAC_INSTALLER_IDENTITY=""
          if [ -f "$KEYCHAIN_PATH" ]; then
            MAC_INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" 2>/dev/null | grep -E "3rd Party Mac Developer Installer" | head -n 1 | sed 's/.*"\(.*\)".*/\1/' || true)
          fi

          PKG_PATH="dist/laterbox-macos.pkg"
          if [ ! -f "$PKG_PATH" ]; then
            echo "macOS PKG not found, skipping Mac App Store upload."
            exit 0
          fi

          if [ -z "$MAC_INSTALLER_IDENTITY" ]; then
            echo "::warning::Skipping Mac App Store Connect upload: App Store Connect strictly requires the macOS package to be signed with a '3rd Party Mac Developer Installer' certificate (Error 90237)."
            echo "To enable Mac App Store uploads, please export your '3rd Party Mac Developer Installer' certificate and private key to GitHub secrets (APPLE_INSTALLER_CERTIFICATE_BASE64 or inside APPLE_CERTIFICATE_BASE64) along with the macOS provisioning profile (APPLE_MAC_PROVISIONING_PROFILE_BASE64)."
            exit 0
          fi

          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

          echo "Uploading $PKG_PATH to Mac App Store Connect / TestFlight..."
          xcrun altool --upload-app \
            -f "$PKG_PATH" \
            -t macos \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

  build-windows:
    name: Build Windows Release & Installer
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.release_scope == 'all'
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress --yes

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Windows Release
        run: flutter build windows --release

      - name: Package Inno Setup Installer & Portable Zip
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package_windows.ps1 -SkipFlutterBuild

      - name: Upload Windows Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-windows-dist
          path: |
            dist/laterbox-windows-setup.exe
            dist/laterbox-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux Release (.tar.gz, .zip)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.release_scope == 'all'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libkeybinder-3.0-dev libayatana-appindicator3-dev zip

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Linux Release
        run: flutter build linux --release

      - name: Package Linux Artifacts
        shell: bash
        run: |
          mkdir -p dist
          tar -czvf dist/laterbox-linux-x64.tar.gz -C build/linux/x64/release/bundle .
          (cd build/linux/x64/release/bundle && zip -r ../../../../../dist/laterbox-linux-x64.zip .)

      - name: Upload Linux Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-linux-dist
          path: |
            dist/laterbox-linux-x64.tar.gz
            dist/laterbox-linux-x64.zip
          if-no-files-found: error

  build-android:
    name: Build Android Release (.apk, .aab) & Google Play
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.release_scope == 'all'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Android Release AppBundle (AAB)
        run: flutter build appbundle --release

      - name: Package Android Artifacts
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" dist/laterbox-android.apk
            cp "$APK_PATH" dist/laterbox-android-release.apk
          fi
          if [ -f "$AAB_PATH" ]; then
            cp "$AAB_PATH" dist/laterbox-android-release.aab
          fi

      - name: Upload Android Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-android-dist
          path: |
            dist/laterbox-android.apk
            dist/laterbox-android-release.apk
            dist/laterbox-android-release.aab
          if-no-files-found: error

      - name: Submit AAB to Google Play Internal Testing
        if: env.PLAY_STORE_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: pro.micorp.laterbox
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}

  build-ios:
    name: Build iOS Release & App Store Connect / TestFlight
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.release_scope == 'all'
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Apple Certificate & Provisioning Profiles
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          # Decode and import Certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Install Main Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/main.mobileprovision
          MAIN_UUID=$(security cms -D -i /tmp/main.mobileprovision | grep -A1 '<key>UUID</key>' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | xargs)
          MAIN_NAME=$(security cms -D -i /tmp/main.mobileprovision | grep -A1 '<key>Name</key>' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | xargs)
          if [ -n "$MAIN_UUID" ]; then
            cp /tmp/main.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${MAIN_UUID}.mobileprovision
            echo "Installed main profile: '$MAIN_NAME' (UUID: $MAIN_UUID)"
          fi

          # Install Share Extension Provisioning Profile
          SHARE_NAME=""
          SHARE_UUID=""
          if [ -n "$APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64" ]; then
            echo "$APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/share.mobileprovision
            SHARE_UUID=$(security cms -D -i /tmp/share.mobileprovision | grep -A1 '<key>UUID</key>' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | xargs)
            SHARE_NAME=$(security cms -D -i /tmp/share.mobileprovision | grep -A1 '<key>Name</key>' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | xargs)
            if [ -n "$SHARE_UUID" ]; then
              cp /tmp/share.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${SHARE_UUID}.mobileprovision
              echo "Installed share extension profile: '$SHARE_NAME' (UUID: $SHARE_UUID)"
            fi
          fi

          # Generate dynamic ExportOptions.plist
          mkdir -p ios
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>pro.micorp.laterbox</key>
              <string>$MAIN_NAME</string>
              <key>pro.micorp.laterbox.ShareExtension</key>
              <string>$SHARE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          cat ios/ExportOptions.plist
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}

      - name: Build Flutter iOS Bundle (no initial codesign)
        run: flutter build ios --release --no-codesign --dart-define=LATERBOX_DISTRIBUTION=app-store

      - name: Archive and Sign iOS IPA
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          mkdir -p build/ios/archive
          mkdir -p build/ios/ipa

          # 1. Archive
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          # 2. Export App Store IPA with manual profile and certificate signing
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}

      - name: Package iOS IPA Artifact
        shell: bash
        run: |
          mkdir -p dist
          IPA_PATH=$(find build/ios -name "*.ipa" | head -n 1)
          if [ -f "$IPA_PATH" ]; then
            cp "$IPA_PATH" dist/laterbox-ios.ipa
          fi

      - name: Upload iOS Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-ios-dist
          path: dist/laterbox-ios.ipa
          if-no-files-found: warn

      - name: Upload to App Store Connect / TestFlight
        if: env.APP_STORE_CONNECT_API_KEY_BASE64 != '' && env.APP_STORE_CONNECT_KEY_ID != ''
        shell: bash
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          
          IPA_PATH=$(find build/ios -name "*.ipa" | head -n 1)
          if [ -f "$IPA_PATH" ]; then
            echo "Uploading $IPA_PATH to App Store Connect..."
            xcrun altool --upload-app \
              -f "$IPA_PATH" \
              -t ios \
              --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
              --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          else
            echo "IPA not found, skipping App Store upload."
          fi
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

  build-extension:
    name: Build Browser Extensions (Chrome, Firefox, Safari)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.release_scope == 'all'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install Extension Dependencies & Package
        run: |
          cd extension
          npm ci
          npm run package
          mkdir -p ../dist
          cp dist/laterbox-chrome-extension.zip ../dist/
          cp dist/laterbox-firefox-extension.zip ../dist/
          cp dist/laterbox-safari-extension.zip ../dist/

      - name: Upload Extension Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-extension-dist
          path: |
            dist/laterbox-chrome-extension.zip
            dist/laterbox-firefox-extension.zip
            dist/laterbox-safari-extension.zip
          if-no-files-found: error

  build-safari-app:
    # Retained temporarily for historical workflow references; the embedded
    # SafariExtension target in build-macos is the only supported release path.
    name: Build & Submit Safari Extension Container (macOS)
    needs: check-version
    if: false
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_SAFARI_MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_SAFARI_MAC_PROVISIONING_PROFILE_BASE64 }}
      APPLE_SAFARI_EXT_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_SAFARI_EXT_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Build Safari Extension Web Assets
        run: |
          cd extension
          npm ci
          npm run build:safari
          mkdir -p "../safari_app/laterbox/Shared (Extension)"
          cp -R dist/safari/* "../safari_app/laterbox/Shared (Extension)/"

      - name: Install Apple Certificates & Keychains
        if: env.APPLE_CERTIFICATE_BASE64 != '' || env.APPLE_INSTALLER_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          if [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
            security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          fi

          if [ -n "$APPLE_INSTALLER_CERTIFICATE_BASE64" ]; then
            INSTALLER_PWD="${APPLE_INSTALLER_CERTIFICATE_PASSWORD:-$APPLE_CERTIFICATE_PASSWORD}"
            echo "$APPLE_INSTALLER_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/installer_cert.p12
            security import $RUNNER_TEMP/installer_cert.p12 -k "$KEYCHAIN_PATH" -P "$INSTALLER_PWD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode Safari Provisioning Profiles if provided
          if [ -n "$APPLE_SAFARI_MAC_PROVISIONING_PROFILE_BASE64" ]; then
            echo "$APPLE_SAFARI_MAC_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/safari_main.provisionprofile
          fi
          if [ -n "$APPLE_SAFARI_EXT_PROVISIONING_PROFILE_BASE64" ]; then
            echo "$APPLE_SAFARI_EXT_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/safari_ext.provisionprofile
          fi
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_SAFARI_MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_SAFARI_MAC_PROVISIONING_PROFILE_BASE64 }}
          APPLE_SAFARI_EXT_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_SAFARI_EXT_PROVISIONING_PROFILE_BASE64 }}

      - name: Build Safari Container Application (macOS)
        run: |
          VERSION=$(node -p "require('./version.json').version")
          BUILD_NUM=$(node -p "require('./version.json').build_number")
          xcodebuild -project safari_app/laterbox/laterbox.xcodeproj \
            -scheme "laterbox (macOS)" \
            -configuration Release \
            -derivedDataPath build/safari_macos \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -destination 'generic/platform=macOS' \
            build

      - name: Package Safari Extension macOS App & PKG
        shell: bash
        run: |
          mkdir -p dist
          APP_PATH=$(find build/safari_macos -name "laterbox.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "laterbox.app" -type d | head -n 1)
          fi

          echo "Packaging Safari Container from: $APP_PATH"

          # Embed provisioning profile if available
          if [ -f /tmp/safari_main.provisionprofile ]; then
            echo "Embedding provisioning profile into Safari container app..."
            cp /tmp/safari_main.provisionprofile "$APP_PATH/Contents/embedded.provisionprofile"
          fi

          EXT_PATH="$APP_PATH/Contents/PlugIns/laterbox Extension.appex"

          # Embed provisioning profile into extension if available
          if [ -f /tmp/safari_ext.provisionprofile ] && [ -d "$EXT_PATH" ]; then
            echo "Embedding provisioning profile into Safari extension..."
            cp /tmp/safari_ext.provisionprofile "$EXT_PATH/Contents/embedded.provisionprofile"
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          MAC_APP_IDENTITY=""
          MAC_INSTALLER_IDENTITY=""
          if [ -f "$KEYCHAIN_PATH" ]; then
            MAC_APP_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" 2>/dev/null | grep -E "3rd Party Mac Developer Application|Apple Distribution|Developer ID Application|Apple Development" | head -n 1 | sed 's/.*"\(.*\)".*/\1/' || true)
            MAC_INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" 2>/dev/null | grep -E "3rd Party Mac Developer Installer" | head -n 1 | sed 's/.*"\(.*\)".*/\1/' || true)
          fi

          SIGN_IDENTITY="${MAC_APP_IDENTITY:--}"
          SIGN_OPTS="--force"
          if [ "$SIGN_IDENTITY" != "-" ]; then
            SIGN_OPTS="--force --timestamp --options runtime"
          fi

          # 1. Sign embedded Safari extension inside-out with its App Sandbox entitlements
          EXT_PATH="$APP_PATH/Contents/PlugIns/laterbox Extension.appex"
          if [ -d "$EXT_PATH" ]; then
            if [ -f "$EXT_PATH/Contents/MacOS/laterbox Extension" ]; then
              codesign $SIGN_OPTS \
                --entitlements "safari_app/laterbox/macOS (Extension)/laterbox_Extension.entitlements" \
                --sign "$SIGN_IDENTITY" \
                "$EXT_PATH/Contents/MacOS/laterbox Extension" || true
            fi
            codesign $SIGN_OPTS \
              --entitlements "safari_app/laterbox/macOS (Extension)/laterbox_Extension.entitlements" \
              --sign "$SIGN_IDENTITY" \
              "$EXT_PATH" || true
          fi

          # 2. Sign container app executable with App Sandbox entitlements
          if [ -f "$APP_PATH/Contents/MacOS/laterbox" ]; then
            codesign $SIGN_OPTS \
              --entitlements "safari_app/laterbox/macOS (App)/laterbox.entitlements" \
              --sign "$SIGN_IDENTITY" \
              "$APP_PATH/Contents/MacOS/laterbox" || true
          fi

          # 3. Sign root container app bundle
          codesign $SIGN_OPTS \
            --entitlements "safari_app/laterbox/macOS (App)/laterbox.entitlements" \
            --sign "$SIGN_IDENTITY" \
            "$APP_PATH" || true

          # Create Universal Zip
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/laterbox-safari-extension-macos.zip

          # Create PKG installer
          if [ -n "$MAC_INSTALLER_IDENTITY" ]; then
            echo "Signing Safari package with: $MAC_INSTALLER_IDENTITY"
            productbuild --sign "$MAC_INSTALLER_IDENTITY" --component "$APP_PATH" /Applications dist/laterbox-safari-extension.pkg
          else
            echo "Creating unsigned Safari package"
            productbuild --component "$APP_PATH" /Applications dist/laterbox-safari-extension.pkg || true
          fi

      - name: Upload Safari App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-safari-app-dist
          path: |
            dist/laterbox-safari-extension.pkg
            dist/laterbox-safari-extension-macos.zip
          if-no-files-found: warn

      - name: Upload Safari Extension to Mac App Store Connect / TestFlight
        if: env.APP_STORE_CONNECT_API_KEY_BASE64 != '' && env.APP_STORE_CONNECT_KEY_ID != ''
        shell: bash
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          MAC_INSTALLER_IDENTITY=""
          if [ -f "$KEYCHAIN_PATH" ]; then
            MAC_INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" 2>/dev/null | grep -E "3rd Party Mac Developer Installer" | head -n 1 | sed 's/.*"\(.*\)".*/\1/' || true)
          fi

          PKG_PATH="dist/laterbox-safari-extension.pkg"
          if [ ! -f "$PKG_PATH" ] || [ -z "$MAC_INSTALLER_IDENTITY" ]; then
            echo "::notice::Skipping Safari Extension App Store upload (requires 3rd Party Mac Developer Installer certificate and registered App Store Connect app for pro.micorp.laterbox.safari)."
            exit 0
          fi

          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

          echo "Submitting Safari Extension package to Mac App Store Connect..."
          xcrun altool --upload-app \
            -f "$PKG_PATH" \
            -t macos \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" || true
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

  build-and-deploy-web:
    name: Build & Deploy Web to Cloudflare
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.release_scope == 'all'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 required by modern Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: laterbox-web/package-lock.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release

      - name: Build Next.js Web App
        run: |
          cd laterbox-web
          npm ci
          npm run build
          npx @opennextjs/cloudflare build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Next.js Web to Cloudflare Workers / Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          cd laterbox-web
          echo "${{ secrets.GITHUB_TOKEN }}" | npx wrangler secret put GITHUB_TOKEN || true
          npx @opennextjs/cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-web-dist
          path: |
            build/web/
            laterbox-web/.open-next/
          if-no-files-found: warn

  create-release:
    name: Publish GitHub Release
    needs: [check-version, build-macos, build-windows, build-linux, build-android, build-ios, build-extension, build-and-deploy-web]
    if: always() && !cancelled() && needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.release_scope == 'all'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: laterbox-macos-dist
          path: dist

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: laterbox-windows-dist
          path: dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: laterbox-linux-dist
          path: dist

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: laterbox-android-dist
          path: dist

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: laterbox-ios-dist
          path: dist

      - name: Download Extension Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: laterbox-extension-dist
          path: dist

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            # Read version from version.json if available
            if [ -f "version.json" ]; then
              V=$(node -p "require('./version.json').version")
              TAG="v$V"
            elif [ -f "laterbox-web/version.json" ]; then
              V=$(node -p "require('./laterbox-web/version.json').version")
              TAG="v$V"
            else
              TAG="v1.0.0"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: LaterBox ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
