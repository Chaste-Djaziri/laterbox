name: Release & Build Laterbox

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Release target to build and publish'
        required: false
        default: 'macos'
        type: choice
        options:
          - macos
          - all
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  check-version:
    name: Detect Release Targets
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      macos: ${{ steps.check.outputs.macos }}
      windows: ${{ steps.check.outputs.windows }}
      linux: ${{ steps.check.outputs.linux }}
      android: ${{ steps.check.outputs.android }}
      ios: ${{ steps.check.outputs.ios }}
      extensions: ${{ steps.check.outputs.extensions }}
      web: ${{ steps.check.outputs.web }}
      publish_release: ${{ steps.check.outputs.publish_release }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Release Targets
        id: check
        shell: bash
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(node -p "require('./version.json').version")
          TARGET_MACOS=false
          TARGET_WINDOWS=false
          TARGET_LINUX=false
          TARGET_ANDROID=false
          TARGET_IOS=false
          TARGET_EXTENSIONS=false
          TARGET_WEB=false

          emit_outputs() {
            local should_release="$1"
            local publish_release=false
            if [ "$TARGET_MACOS" = true ] || [ "$TARGET_WINDOWS" = true ] || [ "$TARGET_LINUX" = true ] || [ "$TARGET_ANDROID" = true ] || [ "$TARGET_IOS" = true ] || [ "$TARGET_EXTENSIONS" = true ]; then
              publish_release=true
            fi

            echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "macos=$TARGET_MACOS" >> "$GITHUB_OUTPUT"
            echo "windows=$TARGET_WINDOWS" >> "$GITHUB_OUTPUT"
            echo "linux=$TARGET_LINUX" >> "$GITHUB_OUTPUT"
            echo "android=$TARGET_ANDROID" >> "$GITHUB_OUTPUT"
            echo "ios=$TARGET_IOS" >> "$GITHUB_OUTPUT"
            echo "extensions=$TARGET_EXTENSIONS" >> "$GITHUB_OUTPUT"
            echo "web=$TARGET_WEB" >> "$GITHUB_OUTPUT"
            echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"
            echo "Selected release targets: macos=$TARGET_MACOS windows=$TARGET_WINDOWS linux=$TARGET_LINUX android=$TARGET_ANDROID ios=$TARGET_IOS extensions=$TARGET_EXTENSIONS web=$TARGET_WEB publish_release=$publish_release"
          }

          select_all_targets() {
            TARGET_MACOS=true
            TARGET_WINDOWS=true
            TARGET_LINUX=true
            TARGET_ANDROID=true
            TARGET_IOS=true
            TARGET_EXTENSIONS=true
            TARGET_WEB=true
          }

          # Manual workflow dispatches default to macos or user choice
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DISPATCH_TARGET="${{ github.event.inputs.target }}"
            if [ -z "$DISPATCH_TARGET" ] || [ "$DISPATCH_TARGET" = "macos" ]; then
              TARGET_MACOS=true
              echo "Manual dispatch targeting macOS only for v$VERSION."
            else
              select_all_targets
              echo "Manual dispatch targeting all platforms for v$VERSION."
            fi
            emit_outputs true
            exit 0
          fi

          # Tags are intentional full releases
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            select_all_targets
            emit_outputs true
            echo "Tag trigger for v$VERSION. Running every release target."
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          BASE_REF="$BEFORE"
          TARGET_REF="$AFTER"
          if ! git rev-parse --verify "$TARGET_REF" >/dev/null 2>&1; then
            TARGET_REF=HEAD
          fi

          # If before commit is a valid commit hash on this repo, check diff across the entire push range
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify "$BEFORE" >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only "$BASE_REF" "$TARGET_REF" 2>/dev/null || echo "")
          else
            # Check against latest tag if available, or last commit
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              BASE_REF="$LAST_TAG"
            else
              BASE_REF=HEAD~1
            fi
            CHANGED_FILES=$(git diff --name-only "$BASE_REF" "$TARGET_REF" 2>/dev/null || echo "")
          fi

          echo "Pushed range: $BEFORE .. $AFTER"
          echo "Changed files in pushed range:"
          echo "$CHANGED_FILES"

          # A normal push is release-eligible only when its version metadata
          # changed. Generated version files below do not, by themselves,
          # select any platform to rebuild.
          VERSION_CHANGED="false"
          if echo "$CHANGED_FILES" | grep -qx 'version.json'; then
            VERSION_CHANGED="true"
          fi
          if git diff --unified=0 "$BASE_REF" "$TARGET_REF" -- pubspec.yaml 2>/dev/null | grep -qE '^[+]version:'; then
            VERSION_CHANGED="true"
          fi

          # Support explicit rebuild-all / force-all override via commit message or v1.0.167
          LAST_COMMIT_MSG=$(git log -1 --pretty=%B 2>/dev/null || echo "")
          if [ "$VERSION" = "1.0.167" ] || \
             echo "$LAST_COMMIT_MSG" | grep -qiE '\[(rebuild-all|force-all|build-all)\]' || \
             [[ "$HEAD_MSG" == *"[rebuild-all]"* ]] || \
             [[ "$HEAD_MSG" == *"[force-all]"* ]] || \
             [[ "$HEAD_MSG" == *"[build-all]"* ]]; then
            select_all_targets
            emit_outputs true
            echo "Explicit rebuild-all override triggered for v$VERSION. Running all release targets."
            exit 0
          fi

          # Keep the existing macOS-only escape hatch for signing and package
          # repairs, including commits that do not include a version bump.
          if [[ "$HEAD_MSG" == *"[macos-only]"* ]] || echo "$LAST_COMMIT_MSG" | grep -qiE '\[macos-only\]'; then
            TARGET_MACOS=true
            emit_outputs true
            echo "Explicit [macos-only] override for v$VERSION."
            exit 0
          fi

          if [ "$VERSION_CHANGED" != "true" ]; then
            emit_outputs false
            echo "No version bump in pushed range. Skipping product release builds."
            exit 0
          fi

          metadata_only_change() {
            local file="$1"
            local diff
            diff=$(git diff --unified=0 "$BASE_REF" "$TARGET_REF" -- "$file" 2>/dev/null || true)
            case "$file" in
              version.json|laterbox-web/version.json|laterbox-web/public/version.json|laterbox-web/src/lib/version.ts)
                return 0
                ;;
              pubspec.yaml)
                echo "$diff" | grep -E '^[+-]' | grep -vE '^(---|\+\+\+|[+-]version:)' | grep -q . && return 1 || return 0
                ;;
              extension/package.json|extension/manifests/chromium.json|extension/manifests/firefox.json|extension/manifests/safari.json)
                echo "$diff" | grep -E '^[+-]' | grep -vE '^(---|\+\+\+|[+-][[:space:]]*"version"[[:space:]]*:)' | grep -q . && return 1 || return 0
                ;;
              scripts/laterbox.iss)
                echo "$diff" | grep -E '^[+-]' | grep -vE '^(---|\+\+\+|[+-]#define[[:space:]]+AppVersion[[:space:]])' | grep -q . && return 1 || return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if metadata_only_change "$file"; then
              echo "Ignoring generated version metadata: $file"
              continue
            fi

            case "$file" in
              lib/*|assets/branding/*|main.dart|pubspec.yaml|pubspec.lock)
                TARGET_MACOS=true; TARGET_WINDOWS=true; TARGET_LINUX=true
                TARGET_ANDROID=true; TARGET_IOS=true; TARGET_WEB=true
                ;;
              macos/*|scripts/package_macos.*)
                TARGET_MACOS=true
                ;;
              windows/*|scripts/package_windows.*)
                TARGET_WINDOWS=true
                ;;
              linux/*|scripts/package_linux.*)
                TARGET_LINUX=true
                ;;
              android/*|scripts/package_android.*)
                TARGET_ANDROID=true
                ;;
              ios/*|scripts/package_ios.*)
                TARGET_IOS=true
                ;;
              extension/*)
                TARGET_EXTENSIONS=true; TARGET_MACOS=true
                ;;
              laterbox-web/*|web/*|cloudflare/*|scripts/deploy_web.*)
                TARGET_WEB=true
                ;;
              *)
                echo "No product release target mapped for: $file"
                ;;
            esac
          done <<< "$CHANGED_FILES"

          emit_outputs true

  build-macos:
    name: Build macOS Release & App Store Connect / TestFlight
    needs: check-version
    if: needs.check-version.outputs.macos == 'true'
    # Run on GitHub-hosted Apple Silicon Mac instances
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_MAC_PROVISIONING_PROFILE_BASE64 }}
      APPLE_MAC_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_MAC_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
      APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
      APPLE_MAC_SAFARI_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_MAC_SAFARI_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
      APPLE_SAFARI_MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_SAFARI_MAC_PROVISIONING_PROFILE_BASE64 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
            echo "DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer" >> "$GITHUB_ENV"
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
            echo "DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer" >> "$GITHUB_ENV"
          elif [ -n "$XCODE_16_DEVELOPER_DIR" ] && [ -d "$XCODE_16_DEVELOPER_DIR" ]; then
            sudo xcode-select -s "$XCODE_16_DEVELOPER_DIR"
            echo "DEVELOPER_DIR=$XCODE_16_DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Safari Extension Assets
        run: |
          cd extension
          npm ci
          npm run build:safari

      - name: Install Flutter Dependencies
        run: |
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages
          flutter pub get

      - name: Install Apple Certificates & Provisioning Profiles
        shell: bash
        run: |
          echo "=== Setting up macOS Signing Keychain & Certificates ==="

          # Create and configure temporary build keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" /Library/Keychains/System.keychain

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          # 1. Decode and import Apple Distribution certificate (p12)
          if [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A
            rm -f "$RUNNER_TEMP/cert.p12"
            echo "Imported Apple Distribution certificate"
          else
            echo "::warning::APPLE_CERTIFICATE_BASE64 is not set"
          fi

          # 2. Decode and import Mac Installer Certificate (p12)
          if [ -n "$APPLE_INSTALLER_CERTIFICATE_BASE64" ]; then
            INSTALLER_PWD="${APPLE_INSTALLER_CERTIFICATE_PASSWORD:-$APPLE_CERTIFICATE_PASSWORD}"
            echo "$APPLE_INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/installer_cert.p12"
            security import "$RUNNER_TEMP/installer_cert.p12" -k "$KEYCHAIN_PATH" -P "$INSTALLER_PWD" -A
            rm -f "$RUNNER_TEMP/installer_cert.p12"
            echo "Imported Apple Installer certificate"
          else
            echo "::warning::APPLE_INSTALLER_CERTIFICATE_BASE64 is not set"
          fi

          # 3. Optional Developer ID certificate (if present)
          if [ -n "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" ]; then
            DEVELOPER_ID_PWD="${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:-$APPLE_CERTIFICATE_PASSWORD}"
            echo "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/developer_id_cert.p12"
            security import "$RUNNER_TEMP/developer_id_cert.p12" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_PWD" -A || true
            rm -f "$RUNNER_TEMP/developer_id_cert.p12"
          fi

          # 4. Import Apple WWDR Intermediate Certificates (G3 and G6) for complete trust chain
          curl --fail --location --retry 3 --max-time 30 \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
            --output "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -A || true
          rm -f "$RUNNER_TEMP/AppleWWDRCAG3.cer"

          curl --fail --location --retry 3 --max-time 30 \
            https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer \
            --output "$RUNNER_TEMP/AppleWWDRCAG6.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG6.cer" -k "$KEYCHAIN_PATH" -A || true
          rm -f "$RUNNER_TEMP/AppleWWDRCAG6.cer"

          # 5. Grant signing tools non-interactive access to keys
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 6. Decode and install Provisioning Profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # Main App Store Profile
          MAIN_PROFILE_B64="$APPLE_MAC_PROVISIONING_PROFILE_BASE64"
          if [ -n "$MAIN_PROFILE_B64" ]; then
            echo "$MAIN_PROFILE_B64" | base64 --decode > /tmp/mac_main.provisionprofile
            UUID=$(security cms -D -i /tmp/mac_main.provisionprofile 2>/dev/null | grep -A1 '<key>UUID</key>' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | xargs || true)
            if [ -n "$UUID" ]; then
              cp /tmp/mac_main.provisionprofile ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.provisionprofile
              echo "Installed macOS main provisioning profile (UUID: $UUID)"
            fi
          else
            echo "::warning::APPLE_MAC_PROVISIONING_PROFILE_BASE64 is not set"
          fi

          # Share Extension Profile
          SHARE_PROFILE_B64="${APPLE_MAC_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64:-$APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64}"
          if [ -n "$SHARE_PROFILE_B64" ]; then
            echo "$SHARE_PROFILE_B64" | base64 --decode > /tmp/mac_share.provisionprofile
            SHARE_UUID=$(security cms -D -i /tmp/mac_share.provisionprofile 2>/dev/null | grep -A1 '<key>UUID</key>' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | xargs || true)
            if [ -n "$SHARE_UUID" ]; then
              cp /tmp/mac_share.provisionprofile ~/Library/MobileDevice/Provisioning\ Profiles/${SHARE_UUID}.provisionprofile
              echo "Installed macOS ShareExtension provisioning profile (UUID: $SHARE_UUID)"
            fi
          fi

          # Safari Extension Profile
          SAFARI_PROFILE_B64="${APPLE_MAC_SAFARI_EXTENSION_PROVISIONING_PROFILE_BASE64:-$APPLE_SAFARI_MAC_PROVISIONING_PROFILE_BASE64}"
          if [ -n "$SAFARI_PROFILE_B64" ]; then
            echo "$SAFARI_PROFILE_B64" | base64 --decode > /tmp/mac_safari.provisionprofile
            SAFARI_UUID=$(security cms -D -i /tmp/mac_safari.provisionprofile 2>/dev/null | grep -A1 '<key>UUID</key>' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | xargs || true)
            if [ -n "$SAFARI_UUID" ]; then
              cp /tmp/mac_safari.provisionprofile ~/Library/MobileDevice/Provisioning\ Profiles/${SAFARI_UUID}.provisionprofile
              echo "Installed macOS SafariExtension provisioning profile (UUID: $SAFARI_UUID)"
            fi
          fi

          echo "=== Available signing identities in keychain ==="
          security find-identity -v "$KEYCHAIN_PATH" || true

      - name: Configure macOS Project
        run: |
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages
          flutter build macos --release --config-only

      - name: Build macOS Application with Xcode
        run: |
          echo "Building Xcode Release target for macOS with derivedDataPath build/macos..."
          set -o pipefail
          xcodebuild -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/macos \
            EXCLUDED_ARCHS="x86_64" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -destination 'generic/platform=macOS' \
            build 2>&1 | tee xcodebuild_macos.log || {
              echo "=== XCODEBUILD BUILD FAILURES ==="
              grep -C 3 -i "error:" xcodebuild_macos.log | tail -n 100 || true
              tail -n 100 xcodebuild_macos.log
              exit 1
            }

      - name: Package Mac App Store PKG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          APP_PATH=$(find build/macos -name "laterbox.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/macos -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "laterbox.app" -type d | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::laterbox.app was not found in build/macos or Xcode DerivedData."
            exit 1
          fi
          echo "Packaging application from: $APP_PATH"

          KEYCHAIN_PATH="${KEYCHAIN_PATH:-$RUNNER_TEMP/build.keychain}"
          echo "Using keychain: $KEYCHAIN_PATH"
          security find-identity -v "$KEYCHAIN_PATH" || true

          # Identify App Store signing credentials
          MAC_APP_STORE_APP_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" 2>/dev/null | grep -E "3rd Party Mac Developer Application|Apple Distribution" | head -n 1 | sed 's/.*"\(.*\)".*/\1/' || true)
          MAC_INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" 2>/dev/null | grep -E "3rd Party Mac Developer Installer" | head -n 1 | sed 's/.*"\(.*\)".*/\1/' || true)

          if [ -z "$MAC_APP_STORE_APP_IDENTITY" ]; then
            echo "::error::Missing Mac App Store Application identity (Apple Distribution or 3rd Party Mac Developer Application) in keychain."
            exit 1
          fi
          if [ -z "$MAC_INSTALLER_IDENTITY" ]; then
            echo "::error::Missing Mac App Store Installer identity (3rd Party Mac Developer Installer) in keychain."
            exit 1
          fi

          echo "App Signing Identity: $MAC_APP_STORE_APP_IDENTITY"
          echo "Installer Signing Identity: $MAC_INSTALLER_IDENTITY"

          APPSTORE_APP="/tmp/appstore/laterbox.app"
          rm -rf /tmp/appstore
          mkdir -p /tmp/appstore
          cp -R "$APP_PATH" "$APPSTORE_APP"

          # Embed provisioning profiles into bundles
          if [ -f /tmp/mac_main.provisionprofile ]; then
            echo "Embedding provisioning profile into main app bundle..."
            cp /tmp/mac_main.provisionprofile "$APPSTORE_APP/Contents/embedded.provisionprofile"
          else
            echo "::warning::No main provisioning profile at /tmp/mac_main.provisionprofile"
          fi

          if [ -f /tmp/mac_share.provisionprofile ] && [ -d "$APPSTORE_APP/Contents/PlugIns/ShareExtension.appex" ]; then
            echo "Embedding provisioning profile into ShareExtension..."
            cp /tmp/mac_share.provisionprofile "$APPSTORE_APP/Contents/PlugIns/ShareExtension.appex/Contents/embedded.provisionprofile"
          fi

          if [ -f /tmp/mac_safari.provisionprofile ] && [ -d "$APPSTORE_APP/Contents/PlugIns/SafariExtension.appex" ]; then
            echo "Embedding provisioning profile into SafariExtension..."
            cp /tmp/mac_safari.provisionprofile "$APPSTORE_APP/Contents/PlugIns/SafariExtension.appex/Contents/embedded.provisionprofile"
          fi

          codesign_cmd() {
            /usr/bin/codesign --keychain "$KEYCHAIN_PATH" "$@"
          }

          # Inside-out signing for App Sandbox & App Store Connect
          echo "Performing inside-out codesigning on $APPSTORE_APP..."
          SIGN_OPTS="--force --timestamp --options runtime"

          # 1. Sign frameworks and dylibs
          if [ -d "$APPSTORE_APP/Contents/Frameworks" ]; then
            find "$APPSTORE_APP/Contents/Frameworks" -depth -type d -name "*.framework" 2>/dev/null | while read -r fw; do
              codesign_cmd $SIGN_OPTS --sign "$MAC_APP_STORE_APP_IDENTITY" "$fw"
            done
            find "$APPSTORE_APP/Contents/Frameworks" -type f \( -name "*.dylib" -o -name "*.so" \) 2>/dev/null | while read -r dylib; do
              codesign_cmd $SIGN_OPTS --sign "$MAC_APP_STORE_APP_IDENTITY" "$dylib"
            done
          fi

          # 2. Sign ShareExtension
          EXT_DIR="$APPSTORE_APP/Contents/PlugIns/ShareExtension.appex"
          if [ -d "$EXT_DIR" ]; then
            if [ -f "$EXT_DIR/Contents/MacOS/ShareExtension" ]; then
              codesign_cmd $SIGN_OPTS \
                --entitlements macos/ShareExtension/ShareExtension.entitlements \
                --sign "$MAC_APP_STORE_APP_IDENTITY" \
                "$EXT_DIR/Contents/MacOS/ShareExtension"
            fi
            codesign_cmd $SIGN_OPTS \
              --entitlements macos/ShareExtension/ShareExtension.entitlements \
              --sign "$MAC_APP_STORE_APP_IDENTITY" \
              "$EXT_DIR"
          fi

          # 3. Sign SafariExtension
          SAFARI_DIR="$APPSTORE_APP/Contents/PlugIns/SafariExtension.appex"
          if [ -d "$SAFARI_DIR" ]; then
            if [ -f "$SAFARI_DIR/Contents/MacOS/SafariExtension" ]; then
              codesign_cmd $SIGN_OPTS \
                --entitlements macos/SafariExtension/SafariExtension.entitlements \
                --sign "$MAC_APP_STORE_APP_IDENTITY" \
                "$SAFARI_DIR/Contents/MacOS/SafariExtension"
            fi
            codesign_cmd $SIGN_OPTS \
              --entitlements macos/SafariExtension/SafariExtension.entitlements \
              --sign "$MAC_APP_STORE_APP_IDENTITY" \
              "$SAFARI_DIR"
          fi

          # 4. Sign main executable
          if [ -f "$APPSTORE_APP/Contents/MacOS/laterbox" ]; then
            codesign_cmd $SIGN_OPTS \
              --entitlements macos/Runner/Release.entitlements \
              --sign "$MAC_APP_STORE_APP_IDENTITY" \
              "$APPSTORE_APP/Contents/MacOS/laterbox"
          fi

          # 5. Sign root app bundle (without --deep to preserve nested entitlements)
          codesign_cmd $SIGN_OPTS \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$MAC_APP_STORE_APP_IDENTITY" \
            "$APPSTORE_APP"

          echo "Verifying application code signature:"
          codesign --verify --deep --strict --verbose=2 "$APPSTORE_APP"

          # 6. Build signed .pkg with productbuild (with watchdog timeout)
          echo "Building signed Mac App Store package with productbuild..."
          run_with_timeout() {
            local timeout_seconds="$1"
            shift

            "$@" &
            local command_pid=$!
            (
              sleep "$timeout_seconds"
              if kill -0 "$command_pid" 2>/dev/null; then
                echo "::error::productbuild exceeded ${timeout_seconds}s; terminating it."
                kill -TERM "$command_pid" 2>/dev/null
                sleep 5
                if kill -0 "$command_pid" 2>/dev/null; then
                  kill -KILL "$command_pid" 2>/dev/null
                fi
              fi
            ) &
            local watchdog_pid=$!

            local command_status=0
            wait "$command_pid" || command_status=$?
            if kill -0 "$watchdog_pid" 2>/dev/null; then
              kill "$watchdog_pid" 2>/dev/null
            fi
            wait "$watchdog_pid" 2>/dev/null || :
            return "$command_status"
          }

          if ! run_with_timeout 300 productbuild \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$MAC_INSTALLER_IDENTITY" \
            --cert "Apple Worldwide Developer Relations Certification Authority" \
            --component "$APPSTORE_APP" /Applications \
            dist/laterbox-macos.pkg; then
            echo "::error::Mac App Store package build failed or timed out."
            exit 1
          fi

          cp dist/laterbox-macos.pkg dist/laterbox-macos-installer.pkg

          echo "Verifying package signature:"
          pkgutil --check-signature dist/laterbox-macos.pkg
          ls -lh dist/laterbox-macos.pkg

      - name: Upload macOS Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-macos-dist
          path: |
            dist/laterbox-macos.pkg
            dist/laterbox-macos-installer.pkg
          if-no-files-found: warn

      - name: Upload to Mac App Store Connect / TestFlight
        shell: bash
        run: |
          set -eo pipefail

          echo "======================================================="
          echo "  Submitting macOS Package to App Store Connect / TestFlight"
          echo "======================================================="

          PKG_PATH="dist/laterbox-macos.pkg"
          if [ ! -f "$PKG_PATH" ]; then
            echo "::error::macOS PKG not found at $PKG_PATH; cannot upload to App Store Connect."
            exit 1
          fi

          echo "Package: $PKG_PATH ($(wc -c < "$PKG_PATH" | xargs) bytes)"
          pkgutil --check-signature "$PKG_PATH" || echo "::warning::Package signature check returned non-zero"

          # Evaluate available credentials
          HAS_API_KEY=false
          if [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ] && [ -n "$APP_STORE_CONNECT_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            HAS_API_KEY=true
          fi

          HAS_APP_PASSWORD=false
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            HAS_APP_PASSWORD=true
          fi

          echo "Authentication check: API Key configured: $HAS_API_KEY | App-Specific Password configured: $HAS_APP_PASSWORD"

          if [ "$HAS_API_KEY" != "true" ] && [ "$HAS_APP_PASSWORD" != "true" ]; then
            echo "::error::No App Store Connect credentials found. Provide APP_STORE_CONNECT_API_KEY_BASE64 / KEY_ID / ISSUER_ID, or APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD."
            exit 1
          fi

          # Setup private key files if API key is provided
          if [ "$HAS_API_KEY" = "true" ]; then
            mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
            P8_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
            echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$P8_PATH"
            cp "$P8_PATH" "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
            chmod 600 "$P8_PATH" "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
            
            if [ ! -s "$P8_PATH" ]; then
              echo "::error::Decoded API Key file $P8_PATH is empty."
              exit 1
            fi
            echo "App Store Connect API Key installed ($P8_PATH)"
          fi

          # Validation runner
          run_validation() {
            local mode="$1"
            echo "--- Validating package with App Store Connect [$mode] ---"
            local code=0
            if [ "$mode" = "api_key" ]; then
              xcrun altool --validate-app \
                -f "$PKG_PATH" \
                -t macos \
                --apiKey "$APP_STORE_CONNECT_KEY_ID" \
                --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
                --show-progress \
                --verbose \
                --output-format normal > validation.log 2>&1 || code=$?
            else
              xcrun altool --validate-app \
                -f "$PKG_PATH" \
                -t macos \
                -u "$APPLE_ID" \
                -p "$APPLE_APP_SPECIFIC_PASSWORD" \
                --show-progress \
                --verbose \
                --output-format normal > validation.log 2>&1 || code=$?
            fi
            return $code
          }

          # Upload runner
          run_upload() {
            local mode="$1"
            echo "--- Uploading package to App Store Connect [$mode] ---"
            local code=0
            if [ "$mode" = "api_key" ]; then
              xcrun altool --upload-app \
                -f "$PKG_PATH" \
                -t macos \
                --apiKey "$APP_STORE_CONNECT_KEY_ID" \
                --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
                --show-progress \
                --verbose \
                --output-format normal > upload.log 2>&1 || code=$?
            else
              xcrun altool --upload-app \
                -f "$PKG_PATH" \
                -t macos \
                -u "$APPLE_ID" \
                -p "$APPLE_APP_SPECIFIC_PASSWORD" \
                --show-progress \
                --verbose \
                --output-format normal > upload.log 2>&1 || code=$?
            fi
            return $code
          }

          PRIMARY_AUTH="api_key"
          [ "$HAS_API_KEY" != "true" ] && PRIMARY_AUTH="app_password"

          # 1. Validation Step
          echo "Running App Store pre-upload validation with $PRIMARY_AUTH..."
          if run_validation "$PRIMARY_AUTH"; then
            echo "[SUCCESS] Validation passed with $PRIMARY_AUTH."
            cat validation.log | grep -E "No errors validating|Validation succeeded|SUCCESS" || cat validation.log
          else
            echo "::warning::Validation failed with $PRIMARY_AUTH. Full log output:"
            cat validation.log

            if [ "$PRIMARY_AUTH" = "api_key" ] && [ "$HAS_APP_PASSWORD" = "true" ]; then
              echo "Retrying validation with App-Specific Password fallback..."
              if run_validation "app_password"; then
                echo "[SUCCESS] Validation passed using App-Specific Password fallback!"
                PRIMARY_AUTH="app_password"
              else
                echo "::error::Validation failed with both API Key and App-Specific Password."
                cat validation.log
                exit 1
              fi
            else
              echo "::error::App Store Connect validation failed. See log output above."
              exit 1
            fi
          fi

          # 2. Upload Step
          echo "Running App Store upload with $PRIMARY_AUTH..."
          if run_upload "$PRIMARY_AUTH"; then
            echo "======================================================="
            echo "  [SUCCESS] Package Uploaded to App Store Connect!"
            echo "======================================================="
            cat upload.log
            DELIVERY_ID=$(grep -i "delivery id" upload.log | sed 's/.*: //' || true)
            REQUEST_ID=$(grep -i "request id" upload.log | sed 's/.*: //' || true)
            [ -n "$DELIVERY_ID" ] && echo "App Store Delivery ID: $DELIVERY_ID"
            [ -n "$REQUEST_ID" ] && echo "App Store Request ID: $REQUEST_ID"
            echo "Build will process in App Store Connect / TestFlight shortly."
          else
            echo "::warning::Upload failed with $PRIMARY_AUTH. Log output:"
            cat upload.log

            if [ "$PRIMARY_AUTH" = "api_key" ] && [ "$HAS_APP_PASSWORD" = "true" ]; then
              echo "Retrying upload with App-Specific Password fallback..."
              if run_upload "app_password"; then
                echo "======================================================="
                echo "  [SUCCESS] Package Uploaded using Fallback Auth!"
                echo "======================================================="
                cat upload.log
                DELIVERY_ID=$(grep -i "delivery id" upload.log | sed 's/.*: //' || true)
                REQUEST_ID=$(grep -i "request id" upload.log | sed 's/.*: //' || true)
                [ -n "$DELIVERY_ID" ] && echo "App Store Delivery ID: $DELIVERY_ID"
                [ -n "$REQUEST_ID" ] && echo "App Store Request ID: $REQUEST_ID"
              else
                echo "::error::Upload failed with fallback authentication as well."
                cat upload.log
                exit 1
              fi
            else
              echo "::error::Upload to App Store Connect failed. See log output above."
              exit 1
            fi
          fi
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

  build-windows:
    name: Build Windows Release & Installer
    needs: check-version
    if: needs.check-version.outputs.windows == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress --yes

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Windows Release
        run: flutter build windows --release

      - name: Package Inno Setup Installer & Portable Zip
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package_windows.ps1 -SkipFlutterBuild

      - name: Upload Windows Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-windows-dist
          path: |
            dist/laterbox-windows-setup.exe
            dist/laterbox-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux Release (.tar.gz, .zip)
    needs: check-version
    if: needs.check-version.outputs.linux == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libkeybinder-3.0-dev libayatana-appindicator3-dev zip

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Linux Release
        run: flutter build linux --release

      - name: Package Linux Artifacts
        shell: bash
        run: |
          mkdir -p dist
          tar -czvf dist/laterbox-linux-x64.tar.gz -C build/linux/x64/release/bundle .
          (cd build/linux/x64/release/bundle && zip -r ../../../../../dist/laterbox-linux-x64.zip .)

      - name: Upload Linux Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-linux-dist
          path: |
            dist/laterbox-linux-x64.tar.gz
            dist/laterbox-linux-x64.zip
          if-no-files-found: error

  build-android:
    name: Build Android Release (.apk, .aab) & Google Play
    needs: check-version
    if: needs.check-version.outputs.android == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Android Release AppBundle (AAB)
        run: flutter build appbundle --release

      - name: Package Android Artifacts
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" dist/laterbox-android.apk
            cp "$APK_PATH" dist/laterbox-android-release.apk
          fi
          if [ -f "$AAB_PATH" ]; then
            cp "$AAB_PATH" dist/laterbox-android-release.aab
          fi

      - name: Upload Android Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-android-dist
          path: |
            dist/laterbox-android.apk
            dist/laterbox-android-release.apk
            dist/laterbox-android-release.aab
          if-no-files-found: error

      - name: Submit AAB to Google Play Internal Testing
        if: env.PLAY_STORE_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: pro.micorp.laterbox
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}

  build-ios:
    name: Build iOS Release & App Store Connect / TestFlight
    needs: check-version
    if: needs.check-version.outputs.ios == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
            echo "DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer" >> "$GITHUB_ENV"
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
            echo "DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer" >> "$GITHUB_ENV"
          elif [ -n "$XCODE_16_DEVELOPER_DIR" ] && [ -d "$XCODE_16_DEVELOPER_DIR" ]; then
            sudo xcode-select -s "$XCODE_16_DEVELOPER_DIR"
            echo "DEVELOPER_DIR=$XCODE_16_DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        run: |
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages
          flutter pub get

      - name: Install Apple Certificate & Provisioning Profiles
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          # Decode and import Certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Install Main Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/main.mobileprovision
          MAIN_UUID=$(security cms -D -i /tmp/main.mobileprovision | grep -A1 '<key>UUID</key>' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | xargs)
          MAIN_NAME=$(security cms -D -i /tmp/main.mobileprovision | grep -A1 '<key>Name</key>' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | xargs)
          if [ -n "$MAIN_UUID" ]; then
            cp /tmp/main.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${MAIN_UUID}.mobileprovision
            echo "Installed main profile: '$MAIN_NAME' (UUID: $MAIN_UUID)"
          fi

          # Install Share Extension Provisioning Profile
          SHARE_NAME=""
          SHARE_UUID=""
          if [ -n "$APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64" ]; then
            echo "$APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/share.mobileprovision
            SHARE_UUID=$(security cms -D -i /tmp/share.mobileprovision | grep -A1 '<key>UUID</key>' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | xargs)
            SHARE_NAME=$(security cms -D -i /tmp/share.mobileprovision | grep -A1 '<key>Name</key>' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | xargs)
            if [ -n "$SHARE_UUID" ]; then
              cp /tmp/share.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${SHARE_UUID}.mobileprovision
              echo "Installed share extension profile: '$SHARE_NAME' (UUID: $SHARE_UUID)"
            fi
          fi

          # Generate dynamic ExportOptions.plist
          mkdir -p ios
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>pro.micorp.laterbox</key>
              <string>$MAIN_NAME</string>
              <key>pro.micorp.laterbox.ShareExtension</key>
              <string>$SHARE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          cat ios/ExportOptions.plist
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}

      - name: Build Flutter iOS Bundle (no initial codesign)
        run: |
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages
          flutter build ios --release --no-codesign --dart-define=LATERBOX_DISTRIBUTION=app-store

      - name: Archive and Sign iOS IPA
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          mkdir -p build/ios/archive
          mkdir -p build/ios/ipa

          # 1. Archive
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          # 2. Export App Store IPA with manual profile and certificate signing
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}

      - name: Package iOS IPA Artifact
        shell: bash
        run: |
          mkdir -p dist
          IPA_PATH=$(find build/ios -name "*.ipa" | head -n 1)
          if [ -f "$IPA_PATH" ]; then
            cp "$IPA_PATH" dist/laterbox-ios.ipa
          fi

      - name: Upload iOS Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-ios-dist
          path: dist/laterbox-ios.ipa
          if-no-files-found: warn

      - name: Upload to App Store Connect / TestFlight
        if: env.APP_STORE_CONNECT_API_KEY_BASE64 != '' && env.APP_STORE_CONNECT_KEY_ID != ''
        shell: bash
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          
          IPA_PATH=$(find build/ios -name "*.ipa" | head -n 1)
          if [ -f "$IPA_PATH" ]; then
            echo "Uploading $IPA_PATH to App Store Connect..."
            xcrun altool --upload-app \
              -f "$IPA_PATH" \
              -t ios \
              --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
              --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          else
            echo "IPA not found, skipping App Store upload."
          fi
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

  build-extension:
    name: Build Browser Extensions (Chrome, Firefox, Safari)
    needs: check-version
    if: needs.check-version.outputs.extensions == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install Extension Dependencies & Package
        run: |
          cd extension
          npm ci
          npm run package
          mkdir -p ../dist
          cp dist/laterbox-chrome-extension.zip ../dist/
          cp dist/laterbox-firefox-extension.zip ../dist/
          cp dist/laterbox-safari-extension.zip ../dist/

      - name: Upload Extension Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-extension-dist
          path: |
            dist/laterbox-chrome-extension.zip
            dist/laterbox-firefox-extension.zip
            dist/laterbox-safari-extension.zip
          if-no-files-found: error

  build-safari-app:
    # Retained temporarily for historical workflow references; the embedded
    # SafariExtension target in build-macos is the only supported release path.
    name: Build & Submit Safari Extension Container (macOS)
    needs: check-version
    if: false
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_SAFARI_MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_SAFARI_MAC_PROVISIONING_PROFILE_BASE64 }}
      APPLE_SAFARI_EXT_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_SAFARI_EXT_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Build Safari Extension Web Assets
        run: |
          cd extension
          npm ci
          npm run build:safari
          mkdir -p "../safari_app/laterbox/Shared (Extension)"
          cp -R dist/safari/* "../safari_app/laterbox/Shared (Extension)/"

      - name: Install Apple Certificates & Keychains
        if: env.APPLE_CERTIFICATE_BASE64 != '' || env.APPLE_INSTALLER_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          if [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
            security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          fi

          if [ -n "$APPLE_INSTALLER_CERTIFICATE_BASE64" ]; then
            INSTALLER_PWD="${APPLE_INSTALLER_CERTIFICATE_PASSWORD:-$APPLE_CERTIFICATE_PASSWORD}"
            echo "$APPLE_INSTALLER_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/installer_cert.p12
            security import $RUNNER_TEMP/installer_cert.p12 -k "$KEYCHAIN_PATH" -P "$INSTALLER_PWD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode Safari Provisioning Profiles if provided
          if [ -n "$APPLE_SAFARI_MAC_PROVISIONING_PROFILE_BASE64" ]; then
            echo "$APPLE_SAFARI_MAC_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/safari_main.provisionprofile
          fi
          if [ -n "$APPLE_SAFARI_EXT_PROVISIONING_PROFILE_BASE64" ]; then
            echo "$APPLE_SAFARI_EXT_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/safari_ext.provisionprofile
          fi
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_SAFARI_MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_SAFARI_MAC_PROVISIONING_PROFILE_BASE64 }}
          APPLE_SAFARI_EXT_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_SAFARI_EXT_PROVISIONING_PROFILE_BASE64 }}

      - name: Build Safari Container Application (macOS)
        run: |
          VERSION=$(node -p "require('./version.json').version")
          BUILD_NUM=$(node -p "require('./version.json').build_number")
          xcodebuild -project safari_app/laterbox/laterbox.xcodeproj \
            -scheme "laterbox (macOS)" \
            -configuration Release \
            -derivedDataPath build/safari_macos \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -destination 'generic/platform=macOS' \
            build

      - name: Package Safari Extension macOS App & PKG
        shell: bash
        run: |
          mkdir -p dist
          APP_PATH=$(find build/safari_macos -name "laterbox.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "laterbox.app" -type d | head -n 1)
          fi

          echo "Packaging Safari Container from: $APP_PATH"

          # Embed provisioning profile if available
          if [ -f /tmp/safari_main.provisionprofile ]; then
            echo "Embedding provisioning profile into Safari container app..."
            cp /tmp/safari_main.provisionprofile "$APP_PATH/Contents/embedded.provisionprofile"
          fi

          EXT_PATH="$APP_PATH/Contents/PlugIns/laterbox Extension.appex"

          # Embed provisioning profile into extension if available
          if [ -f /tmp/safari_ext.provisionprofile ] && [ -d "$EXT_PATH" ]; then
            echo "Embedding provisioning profile into Safari extension..."
            cp /tmp/safari_ext.provisionprofile "$EXT_PATH/Contents/embedded.provisionprofile"
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          MAC_APP_IDENTITY=""
          MAC_INSTALLER_IDENTITY=""
          if [ -f "$KEYCHAIN_PATH" ]; then
            MAC_APP_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" 2>/dev/null | grep -E "3rd Party Mac Developer Application|Apple Distribution|Developer ID Application|Apple Development" | head -n 1 | sed 's/.*"\(.*\)".*/\1/' || true)
            MAC_INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" 2>/dev/null | grep -E "3rd Party Mac Developer Installer" | head -n 1 | sed 's/.*"\(.*\)".*/\1/' || true)
          fi

          SIGN_IDENTITY="${MAC_APP_IDENTITY:--}"
          SIGN_OPTS="--force"
          if [ "$SIGN_IDENTITY" != "-" ]; then
            SIGN_OPTS="--force --timestamp --options runtime"
          fi

          # 1. Sign embedded Safari extension inside-out with its App Sandbox entitlements
          EXT_PATH="$APP_PATH/Contents/PlugIns/laterbox Extension.appex"
          if [ -d "$EXT_PATH" ]; then
            if [ -f "$EXT_PATH/Contents/MacOS/laterbox Extension" ]; then
              codesign $SIGN_OPTS \
                --entitlements "safari_app/laterbox/macOS (Extension)/laterbox_Extension.entitlements" \
                --sign "$SIGN_IDENTITY" \
                "$EXT_PATH/Contents/MacOS/laterbox Extension" || true
            fi
            codesign $SIGN_OPTS \
              --entitlements "safari_app/laterbox/macOS (Extension)/laterbox_Extension.entitlements" \
              --sign "$SIGN_IDENTITY" \
              "$EXT_PATH" || true
          fi

          # 2. Sign container app executable with App Sandbox entitlements
          if [ -f "$APP_PATH/Contents/MacOS/laterbox" ]; then
            codesign $SIGN_OPTS \
              --entitlements "safari_app/laterbox/macOS (App)/laterbox.entitlements" \
              --sign "$SIGN_IDENTITY" \
              "$APP_PATH/Contents/MacOS/laterbox" || true
          fi

          # 3. Sign root container app bundle
          codesign $SIGN_OPTS \
            --entitlements "safari_app/laterbox/macOS (App)/laterbox.entitlements" \
            --sign "$SIGN_IDENTITY" \
            "$APP_PATH" || true

          # Create Universal Zip
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/laterbox-safari-extension-macos.zip

          # Create PKG installer
          if [ -n "$MAC_INSTALLER_IDENTITY" ]; then
            echo "Signing Safari package with: $MAC_INSTALLER_IDENTITY"
            productbuild --sign "$MAC_INSTALLER_IDENTITY" --component "$APP_PATH" /Applications dist/laterbox-safari-extension.pkg
          else
            echo "Creating unsigned Safari package"
            productbuild --component "$APP_PATH" /Applications dist/laterbox-safari-extension.pkg || true
          fi

      - name: Upload Safari App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-safari-app-dist
          path: |
            dist/laterbox-safari-extension.pkg
            dist/laterbox-safari-extension-macos.zip
          if-no-files-found: warn

      - name: Upload Safari Extension to Mac App Store Connect / TestFlight
        if: env.APP_STORE_CONNECT_API_KEY_BASE64 != '' && env.APP_STORE_CONNECT_KEY_ID != ''
        shell: bash
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          MAC_INSTALLER_IDENTITY=""
          if [ -f "$KEYCHAIN_PATH" ]; then
            MAC_INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" 2>/dev/null | grep -E "3rd Party Mac Developer Installer" | head -n 1 | sed 's/.*"\(.*\)".*/\1/' || true)
          fi

          PKG_PATH="dist/laterbox-safari-extension.pkg"
          if [ ! -f "$PKG_PATH" ] || [ -z "$MAC_INSTALLER_IDENTITY" ]; then
            echo "::notice::Skipping Safari Extension App Store upload (requires 3rd Party Mac Developer Installer certificate and registered App Store Connect app for pro.micorp.laterbox.safari)."
            exit 0
          fi

          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

          echo "Submitting Safari Extension package to Mac App Store Connect..."
          xcrun altool --upload-app \
            -f "$PKG_PATH" \
            -t macos \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" || true
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

  build-and-deploy-web:
    name: Build & Deploy Web to Cloudflare
    needs: check-version
    if: needs.check-version.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 required by modern Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: laterbox-web/package-lock.json

      - name: Build Next.js Web App
        run: |
          cd laterbox-web
          npm ci
          npm run build
          npx @opennextjs/cloudflare build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Next.js Web to Cloudflare Workers / Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          cd laterbox-web
          echo "${{ secrets.GITHUB_TOKEN }}" | npx wrangler secret put GITHUB_TOKEN || true
          npx @opennextjs/cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-web-dist
          path: |
            laterbox-web/.open-next/
          if-no-files-found: warn

  create-release:
    name: Publish GitHub Release
    needs: [check-version, build-macos, build-windows, build-linux, build-android, build-ios, build-extension, build-and-deploy-web]
    if: always() && !cancelled() && needs.check-version.outputs.publish_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: laterbox-macos-dist
          path: dist

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: laterbox-windows-dist
          path: dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: laterbox-linux-dist
          path: dist

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: laterbox-android-dist
          path: dist

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: laterbox-ios-dist
          path: dist

      - name: Download Extension Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: laterbox-extension-dist
          path: dist

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            # Read version from version.json if available
            if [ -f "version.json" ]; then
              V=$(node -p "require('./version.json').version")
              TAG="v$V"
            elif [ -f "laterbox-web/version.json" ]; then
              V=$(node -p "require('./laterbox-web/version.json').version")
              TAG="v$V"
            else
              TAG="v1.0.0"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: LaterBox ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
