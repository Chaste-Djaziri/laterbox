name: Web Build & Deploy
on:
  push:
    branches: [main]
    paths: ['laterbox-web/**', '.github/workflows/release.yml']
  pull_request:
    branches: [main]
    paths: ['laterbox-web/**', 'supabase/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: laterbox-web/package-lock.json
      - run: npm ci
        working-directory: laterbox-web
      - name: Validate types and tests
        working-directory: laterbox-web
        run: |
          npx tsc --noEmit
          npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate backend contracts
        run: |
          deno check supabase/functions/notifications/index.ts
          deno test -A supabase/tests/notifications.test.ts supabase/functions/notifications/providers.test.ts supabase/functions/capture/capture.test.ts supabase/functions/extension-connect/extension-connect.test.ts
      - name: Build Cloudflare application
        working-directory: laterbox-web
        env:
          LATERBOX_SKIP_VERSION_BUMP: '1'
        run: npx opennextjs-cloudflare build
      - name: Deploy Cloudflare application
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: laterbox-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          printf '%s' "$GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          npx opennextjs-cloudflare deploy
      - uses: actions/upload-artifact@v4
        with:
          name: laterbox-web-${{ github.run_id }}
          path: laterbox-web/.open-next/
          include-hidden-files: true
          if-no-files-found: error
