name: Web Build & Deploy
on:
  push:
    branches: [main]
    paths: ['laterbox-web/**', 'laterbox-extension/**', 'version.json', 'CHANGELOG.md', 'scripts/**', '.github/workflows/release.yml']
  pull_request:
    branches: [main]
    paths: ['laterbox-web/**', 'laterbox-extension/**', 'supabase/**', 'version.json', 'CHANGELOG.md', 'scripts/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: laterbox-web/package-lock.json
      - run: npm ci
        working-directory: laterbox-web
      - name: Validate types and tests
        working-directory: laterbox-web
        run: |
          npx tsc --noEmit
          npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate backend contracts
        run: |
          deno check supabase/functions/notifications/index.ts
          deno test -A supabase/tests/notifications.test.ts supabase/functions/notifications/providers.test.ts supabase/functions/capture/capture.test.ts supabase/functions/extension-connect/extension-connect.test.ts
      - name: Build and package Web Extensions
        working-directory: laterbox-extension
        run: |
          npm ci
          npm run package
      - name: Build Cloudflare application
        working-directory: laterbox-web
        env:
          LATERBOX_SKIP_VERSION_BUMP: '1'
          NEXT_PUBLIC_PADDLE_ENV: production
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN_PROD: ${{ secrets.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN_PROD || 'live_120047a27807fbb5ef8c51d0373' }}
          NEXT_PUBLIC_PADDLE_PRO_MONTHLY_PRICE_ID_PROD: ${{ vars.NEXT_PUBLIC_PADDLE_PRO_MONTHLY_PRICE_ID_PROD || 'pri_01m2g0r3xap0j8rdr8ewbk7wzj' }}
          NEXT_PUBLIC_PADDLE_PRO_YEARLY_PRICE_ID_PROD: ${{ vars.NEXT_PUBLIC_PADDLE_PRO_YEARLY_PRICE_ID_PROD || 'pri_01m2g0r48pvc4krq97kx0dyer0' }}
        run: npx opennextjs-cloudflare build
      - name: Upload web changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-web-changelog-${{ github.run_id }}
          path: CHANGELOG.md
          if-no-files-found: error
      - name: Resolve release version tag
        id: release_version
        run: |
          VERSION=$(node -e "console.log(require('./version.json').version)")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "title=LaterBox v$VERSION" >> "$GITHUB_OUTPUT"
          tar -czf "$RUNNER_TEMP/laterbox-web-$VERSION.tar.gz" -C laterbox-web .open-next
      - name: Prepare complete release assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          scripts/prepare_release_assets.sh \
            "${{ steps.release_version.outputs.tag }}" \
            "$RUNNER_TEMP/release-assets" \
          "$RUNNER_TEMP/laterbox-web-${{ steps.release_version.outputs.version }}.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach web build to GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: ${{ steps.release_version.outputs.title }}
          draft: false
          prerelease: false
          files: |
            ${{ runner.temp }}/release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Apple purchase verification
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: laterbox-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: node scripts/configure-apple-verification.mjs
      - name: Deploy Cloudflare application
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: laterbox-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          npx opennextjs-cloudflare deploy
      - uses: actions/upload-artifact@v4
        with:
          name: laterbox-web-${{ github.run_id }}
          path: laterbox-web/.open-next/
          include-hidden-files: true
          if-no-files-found: error
