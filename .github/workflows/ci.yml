name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  web-and-contracts:
    name: Web (Next.js) & Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: laterbox-web/package-lock.json
      - name: Install web dependencies
        working-directory: laterbox-web
        run: npm ci
      - name: Check web types, tests, and build
        working-directory: laterbox-web
        run: |
          npx tsc --noEmit
          npm test
          npx next build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check notification dispatcher
        run: deno check supabase/functions/notifications/index.ts
      - name: Test notification SQL, providers and capture compatibility
        run: deno test -A supabase/tests/notifications.test.ts supabase/functions/notifications/providers.test.ts supabase/functions/capture/capture.test.ts supabase/functions/extension-connect/extension-connect.test.ts
