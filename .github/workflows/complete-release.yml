name: Complete GitHub Release

on:
  push:
    branches: [main]
    paths:
      - 'laterbox-ios/laterbox-ios/**'
      - 'laterbox-ios/laterbox-iosTests/**'
      - 'laterbox-ios/laterbox-iosUITests/**'
      - 'laterbox-ios/LaterBoxShare/**'
      - 'laterbox-ios/LaterBoxWidgets/**'
      - 'laterbox-ios/Shared/**'
      - 'laterbox-ios/laterbox-ios.xcodeproj/**'
      - 'laterbox-ios/laterbox-ios.entitlements'
      - 'laterbox-ios/LaterBoxShare.entitlements'
      - 'laterbox-ios/LaterBoxWidgets.entitlements'
      - 'laterbox-ios/ci/**'
      - 'laterbox-ios/version.json'
      - 'ci_scripts/**'
      - 'scripts/apple-review-metadata.py'
      - 'laterbox-web/**'
      - 'supabase/**'
      - 'version.json'
      - 'laterbox-extension/**'
      - 'safari_app/**'
      - '.github/workflows/ios.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/extensions.yml'
      - '.github/workflows/complete-release.yml'
      - 'scripts/platform_changes.py'
      - 'scripts/assemble_release.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: complete-release-main
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      build_ios: ${{ steps.plan.outputs.build_ios }}
      build_web: ${{ steps.plan.outputs.build_web }}
      build_extensions: ${{ steps.plan.outputs.build_extensions }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate platform routing and release packaging
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Select managed baseline and changed platforms
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag=$(gh release list --limit 100 --json tagName,publishedAt,isDraft --jq '[.[] | select(.isDraft == false and (.tagName | startswith("release-main-")))] | sort_by(.publishedAt) | last | .tagName // ""')
          version=$(node -p 'require("./version.json").version')
          if [ -n "$previous_tag" ]; then
            gh release view "$previous_tag" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/previous-asset-names"
            if ! grep -Fxq release-manifest.json "$RUNNER_TEMP/previous-asset-names"; then
              previous_tag=""
            fi
          else
            : > "$RUNNER_TEMP/previous-asset-names"
          fi
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "tag=release-main-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$previous_tag" ]; then
            git diff --name-only -z "$previous_tag" HEAD > "$RUNNER_TEMP/release-changed-paths"
          else
            : > "$RUNNER_TEMP/release-changed-paths"
          fi
          python3 scripts/platform_changes.py \
            --paths "$RUNNER_TEMP/release-changed-paths" \
            --assets "$RUNNER_TEMP/previous-asset-names" \
            --previous-tag "$previous_tag" \
            --github-output "$GITHUB_OUTPUT"

  ios:
    needs: plan
    if: needs.plan.outputs.build_ios == 'true'
    uses: ./.github/workflows/ios.yml
    secrets: inherit

  web:
    needs: plan
    if: needs.plan.outputs.build_web == 'true'
    uses: ./.github/workflows/release.yml
    secrets: inherit

  extensions:
    needs: plan
    if: needs.plan.outputs.build_extensions == 'true'
    uses: ./.github/workflows/extensions.yml
    secrets: inherit

  publish:
    needs: [plan, ios, web, extensions]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      (needs.extensions.result == 'success' || needs.extensions.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v6
        if: needs.plan.outputs.build_ios == 'true'
        with:
          pattern: laterbox-ios-[0-9]*
          path: ${{ runner.temp }}/current/ios
          merge-multiple: true
      - uses: actions/download-artifact@v6
        if: needs.plan.outputs.build_web == 'true'
        with:
          name: laterbox-web-release-${{ github.run_id }}
          path: ${{ runner.temp }}/current/web
      - uses: actions/download-artifact@v6
        if: needs.plan.outputs.build_extensions == 'true'
        with:
          name: laterbox-web-extensions-all-${{ github.run_id }}
          path: ${{ runner.temp }}/current/extensions
      - name: Download only a prior managed release
        if: needs.plan.outputs.previous_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download '${{ needs.plan.outputs.previous_tag }}' --dir "$RUNNER_TEMP/previous"
      - name: Assemble assets and release notes
        run: |
          python3 scripts/assemble_release.py \
            --current "$RUNNER_TEMP/current" \
            --previous "$RUNNER_TEMP/previous" \
            --output "$RUNNER_TEMP/release-assets" \
            --commit "$GITHUB_SHA" \
            --changelog CHANGELOG.md
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release-assets"/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-body.md" --draft=false --latest
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release-assets"/* \
              --target "$GITHUB_SHA" --title "LaterBox v$RELEASE_VERSION ($GITHUB_SHA)" \
              --notes-file "$RUNNER_TEMP/release-body.md" --draft
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
