# .github/workflows/macos.yml
name: Native macOS App Store Connect
on:
  push:
    branches: [main]
    paths:
      - 'laterbox-ios/LaterBoxMac/**'
      - 'laterbox-ios/laterbox-ios.xcodeproj/**'
      - '.github/workflows/macos.yml'
      - 'scripts/upload_macos_appstore.sh'
      - 'laterbox-ios/version.json'
  pull_request:
    branches: [main]
    paths:
      - 'laterbox-ios/LaterBoxMac/**'
      - 'laterbox-ios/laterbox-ios.xcodeproj/**'
      - '.github/workflows/macos.yml'
      - 'scripts/upload_macos_appstore.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-appstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload macOS to App Store Connect
    runs-on: xcode-27
    timeout-minutes: 80
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
      INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      MAC_PROFILE_BASE64: ${{ secrets.APPLE_MAC_PROVISIONING_PROFILE_BASE64 }}
      ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Select supported Xcode and SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks | grep -q macosx
          xcodebuild -list -project laterbox-ios/laterbox-ios.xcodeproj
      - name: Validate macOS Release build for pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project laterbox-ios/laterbox-ios.xcodeproj -scheme LaterBoxMac \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/LaterBoxMacBuild" CODE_SIGNING_ALLOWED=NO build
          test -d "$RUNNER_TEMP/LaterBoxMacBuild/Build/Products/Release/Laterbox.app"
      - name: Upload signed macOS app to App Store Connect
        if: github.event_name != 'pull_request'
        shell: bash
        run: bash scripts/upload_macos_appstore.sh
      - name: Upload archive diagnostics on failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-macos-appstore-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/MacAppStoreExport/*.log
            ${{ runner.temp }}/MacAppStoreExport/DistributionSummary.plist
          if-no-files-found: ignore
          retention-days: 14
