<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaterBox</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="brand">
        <span>LaterBox</span>
        <span class="brand-mark" aria-hidden="true"></span>
      </header>
      <section class="capture-preview" aria-live="polite">
        <p id="domain" class="eyebrow">CURRENT PAGE</p>
        <h1 id="title">Loading page...</h1>
        <p id="url" class="url"></p>
      </section>
      <section id="highlight" class="highlight-panel" hidden>
        <p class="eyebrow">HIGHLIGHT</p>
        <blockquote id="selection"></blockquote>
        <button id="save-highlight" type="button">Save highlight</button>
      </section>
      <section id="disconnected" class="connection-panel">
        <p>Connect LaterBox to start saving across devices.</p>
        <button id="connect" type="button">Connect LaterBox</button>
      </section>
      <section id="connected" class="connection-panel" hidden>
        <p class="connected-label"><span class="status-dot"></span>Connected to LaterBox</p>
        <button id="save" type="button">Save to LaterBox</button>
        <button id="open-panel" class="secondary-button" type="button">Open side panel</button>
        <button id="disconnect" class="link-button" type="button">Disconnect</button>
      </section>
      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
